<title>Ajdar Zapata Screens</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Both TVs show the same thing: the three tall boards side by side at full height. */
  :root { --bg: #121110; color-scheme: dark; }
  html, body { height: 100%; }
  body { background: var(--bg); overflow: hidden; }
  #stage {
    position: fixed; inset: 0; background: var(--bg);
    display: flex; justify-content: center; align-items: center; gap: 1.2vh;
  }
  #stage img { height: 100vh; width: auto; max-width: 33vw; object-fit: contain; flex: 0 1 auto; }
  body.hide-cursor, body.hide-cursor * { cursor: none; }
</style>

<div id="stage">
  <img src="board-1.png" alt="Starters and sides, sauce selection and drinks">
  <img src="board-2.png" alt="Sandwiches and burgers">
  <img src="board-3.png" alt="Doner baguettes, doner platters, shawarma and hot dogs">
</div>

<script>
  const stage = document.getElementById('stage');
  let cursorTimer = null, lock = null;

  // Keep the screen on; ignore it if the TV browser says no.
  async function keepAwake() {
    try { if (!lock && navigator.wakeLock) { lock = await navigator.wakeLock.request('screen'); lock.addEventListener('release', () => lock = null); } } catch (e) {}
  }
  document.addEventListener('visibilitychange', () => { if (!document.hidden) keepAwake(); });
  keepAwake();

  // Tap the screen once for full screen.
  stage.addEventListener('click', () => {
    try { if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {}); } catch (e) {}
  });

  // Hide the mouse pointer when it stops moving.
  function wake() { document.body.classList.remove('hide-cursor'); clearTimeout(cursorTimer); cursorTimer = setTimeout(() => document.body.classList.add('hide-cursor'), 3000); }
  document.addEventListener('mousemove', wake); wake();

  // A board that fails to load tries again a minute later.
  stage.querySelectorAll('img').forEach(b => b.addEventListener('error', () => setTimeout(() => { b.src = b.src.split('?')[0] + '?r=' + Date.now(); }, 60000)));
</script>
