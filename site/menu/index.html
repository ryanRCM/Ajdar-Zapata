<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ajdar Zapata · Menu</title>
<meta name="description" content="Ajdar Zapata menu: sandwiches, burgers, doner, shawarma and hot dogs. 864 High Road, London N12 9RH.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@800&family=Barlow+Semi+Condensed:wght@400;600&family=Vazirmatn:wght@400;600&display=swap">
<style>
  /* The menu for everyone who isn't one of the two shop TVs (phones, laptops): the printed menu's pages
     (menu/Ajdar_Zapata_Menu.pdf, made by tools/make-menu.py), one under the other, readable at phone width. */
  :root { --bg: #fa9817; --ink: #121110; color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  main { max-width: 640px; margin: 0 auto; }
  img { display: block; width: 100%; height: auto; }
  .board { position: relative; }
  footer { padding: 20px 16px 32px; text-align: center; }
  .addr { font: 800 clamp(22px, 6vw, 34px)/1.1 "Barlow Condensed", "Arial Narrow", Impact, sans-serif; border: 3px solid var(--ink); border-radius: 8px; padding: 10px 12px; }
  .allergy { margin-top: 16px; font: 400 16px/1.4 "Barlow Semi Condensed", Arial, sans-serif; text-align: left; }
  .allergy p { margin: 0 0 8px; }
  .allergy [lang="fa"] { font-family: Vazirmatn, Tahoma, sans-serif; text-align: right; }
</style>
</head>
<body>
<i id="nl-badge-frame" hidden></i><!-- stops Netlify's injected badge script: it gives up when this is here -->
<main>
  <div class="board"><img src="/menu/page-1.png" alt="Starters and sides, sauce selection" width="1075" height="1520"></div>
  <div class="board"><img src="/menu/page-2.png" alt="Sandwiches and burgers" width="1075" height="1520" loading="lazy"></div>
  <div class="board"><img src="/menu/page-3.png" alt="Doner baguettes, doner platters and shawarma" width="1075" height="1520" loading="lazy"></div>
  <div class="board"><img src="/menu/page-4.png" alt="Hot dogs and drinks" width="1075" height="1520" loading="lazy"></div>
  <footer>
    <div class="addr">864 High Road, London N12 9RH</div>
    <div class="allergy">
      <p lang="en"><b>Food Allergies and Intolerances:</b> Before ordering please speak to our staff about your requirements.</p>
      <p lang="fa" dir="rtl"><b>حساسیت و عدم تحمل غذایی:</b> لطفاً پیش از سفارش، نیازهای خود را با کارکنان ما در میان بگذارید.</p>
    </div>
  </footer>
</main>
<script>
  // A shop TV that lands here goes back to its own page (it remembers which TV it is: site/tv/index.html; a shop TV
  // not yet told which it is goes to the plain address, which shows it the whole menu).
  try {
    var m = localStorage.getItem('az-tv-m') || (document.cookie.match(/(?:^|; )az_tv=([12])/) || [])[1];
    if (m === '1' || m === '2') location.replace('/tv' + m);
    else if (/t963_ak301/i.test(navigator.userAgent) || (/; wv\)/.test(navigator.userAgent) && !/Mobile/.test(navigator.userAgent))) location.replace('/');
  } catch (e) {}
</script>
</body>
</html>
