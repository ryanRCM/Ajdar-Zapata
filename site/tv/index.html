<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Only this page's own code runs here: Netlify's injected badge script (/.netlify/scripts/hud) is refused. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'unsafe-inline'; style-src 'unsafe-inline'">
<title>Ajdar Zapata</title>
<!-- The shop TVs' page (Ryan, 24 Nov 2026: "make it static", "make sure it doesn't kick it out", "Netlify is
     just the host"). The TVs' browser left the moving pages (/monitor-1/, /monitor-2/) within a minute every
     time, even with every animation off, while the USB videos play all day. The likely cause: the TV goes to
     sleep (or its screensaver) about a minute after the last button press, unless a video is playing. So:
       - a tiny silent video plays all the time in a corner, under the picture (awake.webm / awake.mp4): a playing
         video keeps the TV's screen on, the same way the USB videos do;
       - one ready-made picture, still (site/tv/*.jpg, made by tools/tv-stills.cjs): each TV shows its half of the
         menu, always (24 Nov 2026: "the menu in two parts, one on each monitor, always fixed"); no fonts, canvas
         or animation, as light as a page can be;
       - a new menu is swapped in quietly; when this page itself changes it reloads onto the new version by itself
         (Ryan, 24 Nov 2026: "make it refresh automatically"), at most once in 10 minutes;
       - plain files only: nothing on Netlify but the files themselves.
     Which TV: ajdarzapata.co.uk/tv1 = left TV (items 1-21 and the sauces, yellow), /tv2 = right TV (items 22-43,
     orange). A TV that has opened /tv1 or /tv2 once remembers it, so plain ajdarzapata.co.uk then works on it
     too. Anyone else who opens the plain address (phones, laptops) goes on to the phone menu (/menu/).
     ?preview only looks (it isn't remembered); ?screen=0 makes a device forget it is a TV.
     The shop TVs (their own browser, see shopTV) are never sent to the phone menu: until told which they are,
     they show the whole menu; pressing 1 or 2 on a TV's remote tells it (0 forgets).
     How it is doing: every opening reports to /tv/ping.txt (Netlify's request log keeps a day of these):
     m = monitor, o = when it opened, s = seconds open, ev = what happened, v = the keep-awake video. -->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #ff5a16; cursor: none; }
  img { position: fixed; z-index: 1; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; }
  img.on { opacity: 1; }
  /* the keep-awake video: in the corner, under the picture (it must be on the screen to count, not be seen) */
  video { position: fixed; z-index: 0; right: 0; bottom: 0; width: 64px; height: 64px; }
</style>
</head>
<body>
<i id="nl-badge-frame" hidden></i>
<video id="awake" muted loop playsinline autoplay preload="auto" disablepictureinpicture disableremoteplayback>
  <source src="/tv/awake.webm" type="video/webm">
  <source src="/tv/awake.mp4" type="video/mp4">
</video>
<img id="a" alt=""><img id="b" alt="">
<script>
(function () {
  var PAGE = 'a481bd7a29';   // this page's version: stamped by tools/tv-page.cjs, also into show.json as "page"
  var params = new URLSearchParams(location.search), preview = params.has('preview');
  var ua = navigator.userAgent, phone = /iPhone|iPad|iPod|Android.*Mobile|Mobile Safari/i.test(ua);
  // The shop TVs' own browser (24 Nov 2026: Android 9 WebView, board t963_ak301, Chrome 97), or any Android
  // in-app browser that isn't a phone's: never sent to the phone menu.
  var shopTV = /t963_ak301/i.test(ua) || (/; wv\)/.test(ua) && !/Mobile/.test(ua));

  // ── Which TV: the address (/tv1, /tv2, ?screen=1/2), else what this TV remembers, else not a shop TV.
  function remembered() {
    var m = '';
    try { m = localStorage.getItem('az-tv-m') || ''; } catch (e) {}
    if (m !== '1' && m !== '2') m = (document.cookie.match(/(?:^|; )az_tv=([12])/) || [])[1] || '';
    return Number(m) || 0;
  }
  function remember(m) {
    try { if (m) localStorage.setItem('az-tv-m', String(m)); else localStorage.removeItem('az-tv-m'); } catch (e) {}
    document.cookie = 'az_tv=' + (m || '') + '; Max-Age=' + (m ? 5 * 365 * 86400 : 0) + '; Path=/; SameSite=Lax; Secure';
  }
  var fromPath = /^\/tv-?([12])\/?$/.exec(location.pathname), q = params.get('screen');
  if (q === '0') { remember(0); location.replace('/menu/'); return; }
  var mon = fromPath ? Number(fromPath[1]) : (q === '1' || q === '2') ? Number(q) : remembered();
  if (!mon && !shopTV) { location.replace('/menu/'); return; }           // a phone or laptop: the phone menu
  // a shop TV not yet told which it is shows the whole menu (mon 0) until it is: press 1 or 2 on its remote
  if ((fromPath || q) && !preview && !phone && remembered() !== mon) remember(mon);
  // The address says which TV this is, so a reload never needs the TV's memory: the plain address becomes /tv1 or
  // /tv2 in place (no reload).
  function pin() { try { if (mon && !preview && location.pathname !== '/tv' + mon) history.replaceState(null, '', '/tv' + mon); } catch (e) {} }
  pin();

  // This TV's own ID (kept in its memory; the old lock's ID if it still has one). It goes in the reports, and
  // show.json's "screens" says which half each ID shows (set from Netlify's log, no remote needed).
  function okId(x) { return /^[a-z0-9]{8,40}$/i.test(x || ''); }
  var id = '';
  try { id = localStorage.getItem('az-screen-id') || ''; } catch (e) {}
  if (!okId(id)) id = (document.cookie.match(/(?:^|; )az_id=([a-z0-9]+)/i) || [])[1] || '';
  if (!okId(id)) id = Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
  try { localStorage.setItem('az-screen-id', id); } catch (e) {}
  document.cookie = 'az_id=' + id + '; Max-Age=' + 5 * 365 * 86400 + '; Path=/; SameSite=Lax; Secure';
  var opened = Date.now(), lastErr = '';
  window.addEventListener('error', function (e) { lastErr = String(e.message || 'error').slice(0, 90) + ' @' + String(e.filename || '').split('/').pop() + ':' + (e.lineno || 0); });

  // ── Keep the screen on: the silent video plays all the time (and the wake lock, where the browser has one).
  var video = document.getElementById('awake'), vstate = 'starting', lock = null;
  function play() {
    video.muted = true;
    try {
      var p = video.play();
      if (p && p.then) p.then(function () { vstate = 'playing'; }, function () { vstate = 'blocked'; });
    } catch (e) { vstate = 'blocked'; }
  }
  video.addEventListener('playing', function () { vstate = 'playing'; });
  video.addEventListener('error', function () { vstate = 'error'; }, true);
  video.addEventListener('pause', function () { if (!document.hidden) setTimeout(play, 1000); });
  play();
  function wakeLock() {
    try { if (!lock && navigator.wakeLock) navigator.wakeLock.request('screen').then(function (l) { lock = l; l.addEventListener('release', function () { lock = null; }); }, function () {}); } catch (e) {}
  }
  wakeLock();

  // ── The picture (site/tv/show.json, from tools/tv-stills.cjs): each TV shows its half of the menu, still, always.
  // Its name changes whenever it changes, so a TV can never keep an old copy.
  var imgs = [document.getElementById('a'), document.getElementById('b')], front = 0, shown = '';
  // Load the new picture behind the one on screen, then swap. If it can't load, the old one stays up.
  function put(file) {
    var back = imgs[1 - front], src = '/tv/' + file;
    if (!file || src === shown) return;
    back.onload = function () { back.className = 'on'; imgs[front].className = ''; front = 1 - front; shown = src; };
    back.onerror = function () {};
    back.src = src;
  }
  // Read the list again every 30 seconds (Ryan, 24 Nov 2026: "do updates swiftly").
  function load() {
    fetch('/tv/show.json?t=' + Date.now() + '&p=' + PAGE, { cache: 'no-store' }).then(function (r) { return r.json(); })
      .then(function (j) {
        // A new version of this page is live: reload onto it (at most once in 10 minutes, so it can never loop).
        if (j.page && j.page !== PAGE && !preview) {
          var last = Number((/^az-reload:(\d+)$/.exec(window.name || '') || [])[1]) || 0;
          if (Date.now() - last > 10 * 60 * 1000) { window.name = 'az-reload:' + Date.now(); location.replace(mon ? '/tv' + mon : location.pathname + location.search); return; }
        }
        var given = j.screens && Number(j.screens[id]);
        if (!fromPath && !q && !preview && (given === 1 || given === 2) && given !== mon) { mon = given; remember(mon); pin(); }
        // the Christmas look from 1 Nov to 6 Jan (as site/season.js), else the plain one
        var d = new Date(), mo = d.getMonth() + 1, xmas = mo === 11 || mo === 12 || (mo === 1 && d.getDate() <= 6);
        put(mon ? (xmas && j['tv' + mon + 'x']) || j['tv' + mon] : j.all);
      }).catch(function () {});
  }
  load();
  setInterval(load, 30 * 1000);   // every 30 s: an update reaches the TVs within about a minute of going live

  // ── Telling a TV which it is with its remote: 1 = left TV (first half), 2 = right TV (second half), 0 = forget
  // (back to the whole menu). Remembered like /tv1 and /tv2.
  document.addEventListener('keydown', function (e) {
    var k = e.key === 'Numpad1' ? '1' : e.key === 'Numpad2' ? '2' : e.key === 'Numpad0' ? '0' : e.key;
    if (k !== '0' && k !== '1' && k !== '2') return;
    mon = Number(k);
    if (!preview) remember(mon);
    if (mon) pin(); else try { if (!preview) history.replaceState(null, '', '/'); } catch (e) {}
    load();
    beat('key' + k);
  });

  // ── How it is doing, for Netlify's request log (a plain file, so nothing runs on Netlify).
  function ping(ev) {
    var q = new URLSearchParams({ id: id, m: mon, o: Math.round(opened / 1000), s: Math.round((Date.now() - opened) / 1000), v: vstate + (lock ? '-wl' : '') });
    if (ev) q.set('ev', ev);
    if (lastErr) { q.set('err', lastErr); lastErr = ''; }
    if (ev === 'open') q.set('scr', screen.width + 'x' + screen.height + ' page ' + innerWidth + 'x' + innerHeight + ' x' + (window.devicePixelRatio || 1) + ' mem ' + (navigator.deviceMemory || '?'));
    return '/tv/ping.txt?' + q;
  }
  function beat(ev) {
    if (!preview) fetch(ping(ev), { cache: 'no-store' }).catch(function () {});
    if (video.paused && !document.hidden) play();
  }
  function bye(ev) {   // a last word as the page is put away or closed
    if (preview) return;
    try { if (navigator.sendBeacon && navigator.sendBeacon(ping(ev))) return; } catch (e) {}
    try { fetch(ping(ev), { keepalive: true }); } catch (e) {}
  }
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) bye('hidden'); else { beat('shown'); play(); wakeLock(); }
  });
  window.addEventListener('pagehide', function () { bye('bye'); });
  document.addEventListener('freeze', function () { bye('frozen'); });
  document.addEventListener('resume', function () { beat('resumed'); });
  setTimeout(function () { beat('open'); }, 1500);
  [10, 20, 30, 40, 50, 60, 75, 90, 120, 180, 300].forEach(function (s) { setTimeout(function () { beat(); }, s * 1000); });
  setInterval(function () { beat(); }, 10 * 60 * 1000);
})();
</script>
</body>
</html>
