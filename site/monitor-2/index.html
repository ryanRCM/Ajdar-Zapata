<body data-monitor="2">
<!-- Monitor 2 = the right wall: orange, with motion. Names and numbers in the reel are copied from the
     boards (menu/Ajdar_Zapata_Boards.pdf). -->
<!-- The right TV (orange glass): one menu section at a time, as big as the screen allows, with its food
     animation in the column beside it (Ryan, 2 Nov 2026: one TV static with everything, the other cycling
     big). Every section is lifted straight off the boards by tools/build-walls.py (nothing retyped).
     data-id = the slide's name in the running order (/show.js, which also says how long each stays);
     data-scene = which food animation plays beside it. -->
<div id="stage">
  <div class="embers-bg" data-embers="8" data-rise="95vh"></div>
  <div class="card tvslide sec-starters" data-id="starters" data-accent="#ffb000" data-scene="6"><img src="/monitor-2/sec-starters.png" alt="Starters and sides, 1 to 10"></div>
  <div class="card tvslide sec-sauces" data-id="sauces" data-accent="#ff2f1f" data-scene="7"><img src="/monitor-2/sec-sauces.png" alt="Sauce selection"></div>
  <div class="card tvslide sec-sandwiches" data-id="sandwiches" data-accent="#ff8a00" data-scene="0"><img src="/monitor-2/sec-sandwiches.png" alt="Sandwiches, 11 to 15"></div>
  <div class="card tvslide sec-burgers" data-id="burgers" data-accent="#ff2a10" data-scene="1"><img src="/monitor-2/sec-burgers.png" alt="Burgers, 16 to 20"></div>
  <div class="card tvslide sec-doner" data-id="doner" data-accent="#ff5c00" data-scene="2"><img src="/monitor-2/sec-doner.png" alt="Doner baguettes, 21 to 24"></div>
  <div class="card tvslide sec-platters" data-id="platters" data-accent="#ff7a10" data-scene="3"><img src="/monitor-2/sec-platters.png" alt="Doner platters, 25 to 27"></div>
  <div class="card tvslide sec-shawarma" data-id="shawarma" data-accent="#ffa200" data-scene="4"><img src="/monitor-2/sec-shawarma.png" alt="Shawarma, 28 to 30"></div>
  <div class="card tvslide sec-hotdogs" data-id="hotdogs" data-accent="#ff3a1c" data-scene="5"><img src="/monitor-2/sec-hotdogs.png" alt="Hot dogs, 31 to 35"></div>
  <div class="card tvslide sec-drinks" data-id="drinks" data-accent="#ff9a1c" data-scene="8"><img src="/monitor-2/sec-drinks.png" alt="Drinks"></div>

       claims. The sauce names are pictures lifted straight off the board (tools/build-sauces.py). ───── -->

      <div class="sauce has-pot" style="--c:#e3221b;--c2:#8f0d08;--k:3">
        <img class="pot" src="/monitor-2/photo-sauce-spicy-chilli.webp" alt="">
        <div class="zig"><div class="zig-in"><svg viewBox="0 0 400 40" preserveAspectRatio="none"><path d="M0 20 Q 12.5 2 25 20 T 50 20 T 75 20 T 100 20 T 125 20 T 150 20 T 175 20 T 200 20 T 225 20 T 250 20 T 275 20 T 300 20 T 325 20 T 350 20 T 375 20 T 400 20"/><path class="hi" d="M0 20 Q 12.5 2 25 20 T 50 20 T 75 20 T 100 20 T 125 20 T 150 20 T 175 20 T 200 20 T 225 20 T 250 20 T 275 20 T 300 20 T 325 20 T 350 20 T 375 20 T 400 20"/></svg></div></div>

      <div class="sauce" style="--c:#fff2c2;--c2:#e2c56a;--k:6">

    <div class="hero-snow" data-snow="14"></div>

  <section class="hero hero-sandwich" data-id="hero-sandwich" aria-label="Sandwiches, 11 to 15">
    <div class="rays"></div>
    <div class="kb">
      <img class="back b1" src="/monitor-2/photo-minced-sub.webp" alt="">
      <img class="back b2" src="/monitor-2/photo-salami-steak-sub.webp" alt="">
      <div class="cutsub">
        <div class="enter">
          <div class="half l"><img src="/monitor-2/photo-salami-sub.webp" alt=""></div>
          <div class="half r"><img src="/monitor-2/photo-salami-sub.webp" alt=""></div>
          <div class="shine"><i></i></div>
          <i class="slash"></i>
          <i class="steam s1"></i><i class="steam s2"></i><i class="steam s3"></i>
          <i class="crumb" style="--k:0;--x:47%;--dx:-3vw"></i><i class="crumb" style="--k:1;--x:50%;--dx:2vw"></i><i class="crumb" style="--k:2;--x:49%;--dx:-1vw"></i>
          <i class="crumb" style="--k:3;--x:51%;--dx:3.5vw"></i><i class="crumb" style="--k:4;--x:48%;--dx:-4vw"></i><i class="crumb" style="--k:5;--x:50%;--dx:.5vw"></i>
          <i class="sdrip" style="--x:44%;--k:0"></i><i class="sdrip" style="--x:56%;--k:1"></i>
        </div>
      </div>
    </div>
    <div class="hero-type"><div class="word smash" data-text="SANDWICHES"></div>
      <div class="meta2"><span class="sub"><small>NO.</small> 11 – 15</span><span class="fa">ساندویچ</span></div></div>
    <div class="hero-snow" data-snow="12"></div>
  </section>

  <section class="hero hero-burger" data-id="hero-burger" aria-label="Burgers, 16 to 20">
    <div class="rays"></div>
    <div class="plate"><i class="ring"></i></div>
    <div class="turn"><img src="/monitor-2/photo-chicken-fillet-sub.webp" alt=""></div>
    <div class="slam"><div class="squash"><img src="/monitor-2/photo-beef-patty-sub.webp" alt=""><div class="shine"><i></i></div></div></div>
    <i class="shock"></i>
    <div class="sparks"><i style="--a:-170deg;--r:26vh;--k:0"></i><i style="--a:-150deg;--r:34vh;--k:1"></i><i style="--a:-128deg;--r:22vh;--k:2"></i><i style="--a:-105deg;--r:30vh;--k:3"></i><i style="--a:-80deg;--r:36vh;--k:4"></i><i style="--a:-58deg;--r:24vh;--k:5"></i><i style="--a:-35deg;--r:32vh;--k:6"></i><i style="--a:-12deg;--r:26vh;--k:7"></i><i style="--a:10deg;--r:20vh;--k:8"></i><i style="--a:195deg;--r:18vh;--k:9"></i><i style="--a:170deg;--r:22vh;--k:10"></i><i style="--a:-95deg;--r:16vh;--k:11"></i></div>
    <div class="hero-type"><div class="word smash" data-text="BURGERS"></div>
      <div class="meta2"><span class="sub"><small>NO.</small> 16 – 20</span><span class="fa">برگر</span></div></div>
    <div class="hero-snow" data-snow="12"></div>
  </section>

  <section class="hero hero-brand" data-id="hero-brand" aria-label="Ajdar Zapata, Merry Christmas">
    <div class="rays"></div>
    <div class="orbit">
      <div class="ox" style="--ph:0s"><div class="oy"><img src="/monitor-2/photo-salami-sub.webp" alt=""></div></div>
      <div class="ox" style="--ph:-4s"><div class="oy"><img src="/monitor-2/photo-minced-sub.webp" alt=""></div></div>
      <div class="ox" style="--ph:-8s"><div class="oy"><img src="/monitor-2/photo-chicken-fillet-sub.webp" alt=""></div></div>
    </div>
    <img class="big-logo" src="/monitor-2/logo-big.webp" alt="Ajdar Zapata Sandwich">
    <div class="stars"><i style="--x:12%;--y:18%;--k:0"></i><i style="--x:86%;--y:14%;--k:1"></i><i style="--x:22%;--y:70%;--k:2"></i><i style="--x:78%;--y:66%;--k:3"></i><i style="--x:50%;--y:8%;--k:4"></i><i style="--x:6%;--y:44%;--k:5"></i><i style="--x:94%;--y:42%;--k:6"></i><i style="--x:35%;--y:30%;--k:7"></i><i style="--x:66%;--y:30%;--k:8"></i></div>

    <div class="hero-snow" data-snow="22"></div>
