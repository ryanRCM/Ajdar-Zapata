<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ajdar Zapata · Monitor 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Vazirmatn:wght@700&display=swap">
<link rel="stylesheet" href="/screen.css">
<style>
  /* Monitor 2 = monitor 1 + motion: a food reel in board two's empty strip,
     a slow light sweep over the boards, and a warm glow on the middle logo. */
  :root {
    --bun: #d98a2b; --bun-dark: #a85f17; --crust: #f2b45a;
    --meat: #8a3b1c; --meat-light: #b9572a; --lettuce: #5fae3b; --tomato: #d6352b;
    --cheese: #f5c518; --sausage: #b8432a; --mustard: #f3c623; --pitta: #e9c88a;
    --display: "Bebas Neue", Impact, "Arial Narrow", sans-serif;
    --fa: "Vazirmatn", Tahoma, sans-serif;
  }

  /* The reel sits in the blank strip above board two's address bar (76.5%–90.6% of its height). */
  .reel {
    position: absolute; left: 5.5%; right: 5.5%; top: 77.2%; height: 12.6%;
    overflow: hidden; pointer-events: none;
  }
  .reel::after { /* glowing floor line */
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 0.28vh;
    background: linear-gradient(90deg, transparent, var(--orange) 20%, #ffb347 50%, var(--orange) 80%, transparent);
    animation: floor 2.4s ease-in-out infinite;
  }
  @keyframes floor { 50% { opacity: .45; filter: blur(0.3px); } }

  .scene { position: absolute; inset: 0; display: flex; align-items: center; gap: 1.6vw; opacity: 0; }
  .scene.on { opacity: 1; }
  .scene.out { opacity: 1; animation: leave .45s cubic-bezier(.6,0,.9,.4) forwards; }
  @keyframes leave { to { opacity: 0; transform: translateY(-35%); } }

  .art { flex: 0 0 auto; width: 9.5vw; height: 11.2vh; }
  .art svg { width: 100%; height: 100%; overflow: visible; }

  .words { flex: 1 1 auto; min-width: 0; display: grid; gap: .25vh; }
  .label {
    font-family: var(--display); color: var(--cream); font-size: 6.6vh; line-height: .9;
    letter-spacing: .06em; white-space: nowrap; clip-path: inset(0 100% 0 0);
  }
  .label b { color: var(--orange); font-weight: inherit; }
  .meta { display: flex; justify-content: space-between; align-items: baseline; gap: 1vw; opacity: 0; }
  .nums { font-family: var(--display); color: var(--orange); font-size: 2.3vh; letter-spacing: .14em; }
  .fa { font-family: var(--fa); color: var(--orange); font-size: 2.5vh; direction: rtl; }
  .rule { height: .35vh; background: var(--orange); transform: scaleX(0); transform-origin: left; }

  .scene.on .label { animation: wipe .55s .15s cubic-bezier(.2,.8,.2,1) forwards; }
  .scene.on .rule  { animation: grow .5s .45s cubic-bezier(.2,.8,.2,1) forwards; }
  .scene.on .meta  { animation: rise .45s .6s ease-out forwards; }
  @keyframes wipe { to { clip-path: inset(0 0 0 0); } }
  @keyframes grow { to { transform: scaleX(1); } }
  @keyframes rise { from { opacity: 0; transform: translateY(40%); } to { opacity: 1; transform: none; } }

  /* Layers stack in from above (sandwich, burger), then the food settles with a small bounce. */
  .layer { opacity: 0; transform-box: fill-box; }
  .scene.on .layer { animation: drop .42s cubic-bezier(.3,1.5,.5,1) forwards; }
  .scene.on .layer:nth-of-type(1) { animation-delay: .05s; }
  .scene.on .layer:nth-of-type(2) { animation-delay: .17s; }
  .scene.on .layer:nth-of-type(3) { animation-delay: .29s; }
  .scene.on .layer:nth-of-type(4) { animation-delay: .41s; }
  .scene.on .layer:nth-of-type(5) { animation-delay: .53s; }
  .scene.on .layer:nth-of-type(6) { animation-delay: .65s; }
  @keyframes drop { from { opacity: 0; transform: translateY(-60px); } to { opacity: 1; transform: none; } }
  .scene.on .bob { animation: bob 1.6s 1.1s ease-in-out infinite; transform-box: fill-box; transform-origin: bottom; }
  @keyframes bob { 50% { transform: translateY(-3px) scaleY(1.02); } }

  /* Steam rising off the food. */
  .steam path { fill: none; stroke: rgba(246,239,228,.55); stroke-width: 2.2; stroke-linecap: round; opacity: 0; }
  .scene.on .steam path { animation: steam 2.2s ease-out infinite; }
  .scene.on .steam path:nth-child(2) { animation-delay: .7s; }
  .scene.on .steam path:nth-child(3) { animation-delay: 1.4s; }
  @keyframes steam { 0% { opacity: 0; transform: translateY(6px); } 30% { opacity: .9; } 100% { opacity: 0; transform: translateY(-14px); } }

  /* Doner: meat bands slide sideways so the spit looks like it's turning; the burner flickers. */
  .scene.on .spit-bands { animation: turn 1.1s linear infinite; }
  @keyframes turn { to { transform: translateX(-16px); } }
  .flame { transform-box: fill-box; transform-origin: bottom; }
  .scene.on .flame { animation: flick .28s ease-in-out infinite alternate; }
  .scene.on .flame:nth-of-type(2) { animation-duration: .34s; }
  .scene.on .flame:nth-of-type(3) { animation-duration: .23s; }
  @keyframes flick { from { transform: scaleY(.82) skewX(-4deg); opacity: .8; } to { transform: scaleY(1.12) skewX(4deg); opacity: 1; } }
  .art .whole { transform-box: fill-box; transform-origin: center; }
  .scene.on .whole { animation: pop .5s cubic-bezier(.3,1.6,.5,1) both; }
  @keyframes pop { from { opacity: 0; transform: scale(.4) rotate(-12deg); } to { opacity: 1; transform: none; } }

  /* Hot dog: the mustard draws itself on. */
  .mustard { stroke-dasharray: 160; stroke-dashoffset: 160; }
  .scene.on .mustard { animation: draw .7s .6s ease-out forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }

  /* A slow diagonal light sweep across all three boards. */
  .sweep {
    position: fixed; inset: 0; pointer-events: none; mix-blend-mode: screen;
    background: linear-gradient(105deg, transparent 40%, rgba(255,190,120,.10) 47%, rgba(255,230,190,.22) 50%, rgba(255,190,120,.10) 53%, transparent 60%);
    background-size: 300% 100%; background-position: 150% 0;
    animation: sweep 14s ease-in-out infinite;
  }
  @keyframes sweep { 0%, 70% { background-position: 150% 0; } 100% { background-position: -50% 0; } }

  /* Warm pulse behind the middle board's logo. */
  .glow {
    position: absolute; left: 25%; right: 25%; top: 1.5%; height: 11%; pointer-events: none;
    background: radial-gradient(closest-side, rgba(240,124,26,.35), transparent);
    mix-blend-mode: screen; animation: glow 3s ease-in-out infinite;
  }
  @keyframes glow { 50% { opacity: .35; transform: scale(1.08); } }

  @media (prefers-reduced-motion: reduce) { .sweep, .glow, .reel::after { animation: none; } }
</style>
</head>
<body>
<div id="stage">
  <div class="board"><img src="/board-1.png" alt="Starters and sides, sauce selection and drinks"></div>
  <div class="board">
    <img src="/board-2.png" alt="Sandwiches and burgers">
    <div class="glow"></div>
    <div class="reel" aria-hidden="true">

      <div class="scene">
        <div class="art"><svg viewBox="0 0 140 100">
          <g class="bob">
            <path class="layer" d="M14 70 Q70 82 126 70 L122 78 Q70 90 18 78 Z" fill="var(--bun-dark)"/>
            <path class="layer" d="M12 66 Q30 58 46 66 T80 66 T114 66 T130 64 L128 72 Q70 80 12 72 Z" fill="var(--lettuce)"/>
            <g class="layer"><circle cx="38" cy="62" r="8" fill="var(--tomato)"/><circle cx="70" cy="63" r="8" fill="var(--tomato)"/><circle cx="102" cy="62" r="8" fill="var(--tomato)"/></g>
            <path class="layer" d="M16 60 Q70 50 124 60 L124 64 Q70 56 16 64 Z" fill="#c2585a"/>
            <g class="layer"><path d="M10 58 Q12 36 70 32 Q128 36 130 58 Q70 50 10 58 Z" fill="var(--bun)"/>
              <path d="M36 44 l10 -6 M62 40 l10 -6 M88 41 l10 -6" stroke="var(--crust)" stroke-width="3" stroke-linecap="round"/></g>
          </g>
          <g class="steam"><path d="M50 26 q-5 -6 0 -12 q5 -6 0 -12"/><path d="M72 24 q-5 -6 0 -12 q5 -6 0 -12"/><path d="M94 26 q-5 -6 0 -12 q5 -6 0 -12"/></g>
        </svg></div>
        <div class="words"><div class="label">SANDWICHES</div><div class="rule"></div>
          <div class="meta"><span class="nums">NO. 11 – 15</span><span class="fa">ساندویچ</span></div></div>
      </div>

      <div class="scene">
        <div class="art"><svg viewBox="0 0 140 100">
          <g class="bob">
            <path class="layer" d="M36 78 h68 q4 0 4 4 q-38 10 -76 0 q0 -4 4 -4 Z" fill="var(--bun-dark)"/>
            <path class="layer" d="M30 70 h80 l-6 8 h-68 Z" fill="var(--meat)"/>
            <path class="layer" d="M30 68 h80 l-10 8 l-8 -5 l-10 9 l-10 -9 l-12 8 l-8 -6 l-12 6 Z" fill="var(--cheese)"/>
            <path class="layer" d="M28 64 q8 -6 14 0 t14 0 t14 0 t14 0 t14 0 t14 0 v4 h-84 Z" fill="var(--lettuce)"/>
            <g class="layer"><path d="M30 62 Q30 30 70 30 Q110 30 110 62 Z" fill="var(--bun)"/>
              <g fill="#fff3d6"><ellipse cx="56" cy="42" rx="2.6" ry="1.5"/><ellipse cx="72" cy="38" rx="2.6" ry="1.5"/><ellipse cx="86" cy="45" rx="2.6" ry="1.5"/><ellipse cx="64" cy="50" rx="2.6" ry="1.5"/></g></g>
          </g>
          <g class="steam"><path d="M56 24 q-5 -6 0 -12 q5 -6 0 -12"/><path d="M84 24 q-5 -6 0 -12 q5 -6 0 -12"/></g>
        </svg></div>
        <div class="words"><div class="label">BURGERS</div><div class="rule"></div>
          <div class="meta"><span class="nums">NO. 16 – 20</span><span class="fa">برگر</span></div></div>
      </div>

      <div class="scene">
        <div class="art"><svg viewBox="0 0 140 100">
          <defs><clipPath id="cone"><path d="M46 14 H94 L84 86 H56 Z"/></clipPath></defs>
          <g class="whole">
            <rect x="68.5" y="2" width="3" height="96" rx="1.5" fill="#cfd2d6"/>
            <g clip-path="url(#cone)">
              <rect x="30" y="10" width="90" height="80" fill="var(--meat)"/>
              <g class="spit-bands">
                <path d="M20 22 h120 M20 34 h120 M20 46 h120 M20 58 h120 M20 70 h120 M20 82 h120" stroke="var(--meat-light)" stroke-width="5"/>
                <path d="M24 16 l8 80 M40 16 l8 80 M56 16 l8 80 M72 16 l8 80 M88 16 l8 80 M104 16 l8 80 M120 16 l8 80" stroke="rgba(40,14,4,.35)" stroke-width="3"/>
              </g>
              <path d="M46 14 H58 L62 86 H56 Z" fill="rgba(255,190,110,.25)"/>
            </g>
            <g transform="translate(104 30)">
              <path class="flame" d="M0 50 Q-6 30 4 14 Q2 30 10 36 Q14 22 10 8 Q24 26 16 50 Z" fill="#ff6a1a"/>
              <path class="flame" d="M4 50 Q0 36 8 26 Q8 36 13 40 Q16 32 14 24 Q22 38 16 50 Z" fill="#ffb02e"/>
              <path class="flame" d="M7 50 Q5 42 10 36 Q11 42 13 44 Q15 40 14 36 Q18 44 15 50 Z" fill="#fff0a8"/>
            </g>
          </g>
        </svg></div>
        <div class="words"><div class="label">DONER</div><div class="rule"></div>
          <div class="meta"><span class="nums">NO. 21 – 27</span><span class="fa">دونر</span></div></div>
      </div>

      <div class="scene">
        <div class="art"><svg viewBox="0 0 140 100">
          <g class="whole">
            <path d="M50 30 Q70 18 92 30 L100 34 Q86 26 72 28 Q58 30 50 30 Z" fill="var(--lettuce)"/>
            <path d="M54 30 Q70 22 90 30 L92 34 Q72 28 54 34 Z" fill="var(--meat-light)"/>
            <path d="M44 32 Q72 24 100 34 L78 94 Q74 98 70 94 Z" fill="var(--pitta)"/>
            <path d="M44 32 Q60 40 72 96" stroke="#c9a464" stroke-width="2.5" fill="none"/>
            <path d="M58 52 l16 4 M62 66 l12 3 M66 80 l8 2" stroke="#b98a45" stroke-width="2.5" stroke-linecap="round"/>
          </g>
          <g class="steam"><path d="M62 20 q-5 -6 0 -12 q5 -6 0 -12"/><path d="M82 20 q-5 -6 0 -12 q5 -6 0 -12"/></g>
        </svg></div>
        <div class="words"><div class="label">SHAWARMA</div><div class="rule"></div>
          <div class="meta"><span class="nums">NO. 28 – 30</span><span class="fa">شاورما</span></div></div>
      </div>

      <div class="scene">
        <div class="art"><svg viewBox="0 0 140 100">
          <g class="whole">
            <path d="M14 62 Q14 80 32 80 H108 Q126 80 126 62 Q70 72 14 62 Z" fill="var(--bun)"/>
            <rect x="8" y="48" width="124" height="18" rx="9" fill="var(--sausage)"/>
            <path d="M16 52 h108" stroke="rgba(255,200,170,.35)" stroke-width="3" stroke-linecap="round"/>
            <path class="mustard" d="M18 56 l8 -6 l8 8 l8 -8 l8 8 l8 -8 l8 8 l8 -8 l8 8 l8 -8 l8 8 l8 -8 l8 8 l8 -6" fill="none" stroke="var(--mustard)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
          </g>
          <g class="steam"><path d="M48 38 q-5 -6 0 -12 q5 -6 0 -12"/><path d="M92 38 q-5 -6 0 -12 q5 -6 0 -12"/></g>
        </svg></div>
        <div class="words"><div class="label">HOT <b>DOGS</b></div><div class="rule"></div>
          <div class="meta"><span class="nums">NO. 31 – 35</span><span class="fa">هات‌داگ</span></div></div>
      </div>

    </div>
  </div>
  <div class="board"><img src="/board-3.png" alt="Doner baguettes, doner platters, shawarma and hot dogs"></div>
</div>
<div class="sweep"></div>

<script>
  // Play the food reel: each scene holds for 3.6 seconds, then lifts away for the next.
  (() => {
    const scenes = [...document.querySelectorAll('.scene')];
    let i = 0;
    scenes[0].classList.add('on');
    setInterval(() => {
      const cur = scenes[i];
      cur.classList.replace('on', 'out');
      setTimeout(() => cur.classList.remove('out'), 450);
      i = (i + 1) % scenes.length;
      setTimeout(() => scenes[i].classList.add('on'), 250);
    }, 3600);
  })();
</script>
<script src="/screen.js"></script>
</body>
</html>
