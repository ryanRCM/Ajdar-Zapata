<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ajdar Zapata · Monitor 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Semi+Condensed:wght@600;800&family=Vazirmatn:wght@600;700&display=swap">
<link rel="stylesheet" href="/screen.css">
<link rel="stylesheet" href="/monitor-2/motion.css">
<link rel="stylesheet" href="/monitor-2/layout.css">
</head>
<body data-monitor="2">
<!-- Monitor 2 = the right wall: orange, with motion. Names and numbers in the reel are copied from the
     boards (menu/Ajdar_Zapata_Boards.pdf). -->
<!-- The right TV (orange glass): one menu section at a time, as big as the screen allows, with its food
     animation in the column beside it (Ryan, 2 Nov 2026: one TV static with everything, the other cycling
     big). Every section is lifted straight off the boards by tools/build-walls.py (nothing retyped).
     data-hold = seconds on screen; data-scene = which food animation plays beside it. -->
<div id="stage">
  <div class="embers-bg" data-embers="8" data-rise="95vh"></div>
  <div class="card tvslide sec-starters" data-hold="10" data-accent="#ffb000" data-scene="6"><img src="/monitor-2/sec-starters.png" alt="Starters and sides, 1 to 10"></div>
  <div class="card tvslide sec-sauces" data-hold="8" data-accent="#ff2f1f" data-scene="7"><img src="/monitor-2/sec-sauces.png" alt="Sauce selection"></div>
  <div class="card tvslide sec-sandwiches" data-hold="10" data-accent="#ff8a00" data-scene="0"><img src="/monitor-2/sec-sandwiches.png" alt="Sandwiches, 11 to 15"></div>
  <div class="card tvslide sec-burgers" data-hold="9" data-accent="#ff2a10" data-scene="1"><img src="/monitor-2/sec-burgers.png" alt="Burgers, 16 to 20"></div>
  <div class="card tvslide sec-doner" data-hold="8" data-accent="#ff5c00" data-scene="2"><img src="/monitor-2/sec-doner.png" alt="Doner baguettes, 21 to 24"></div>
  <div class="card tvslide sec-platters" data-hold="7" data-accent="#ff7a10" data-scene="3"><img src="/monitor-2/sec-platters.png" alt="Doner platters, 25 to 27"></div>
  <div class="card tvslide sec-shawarma" data-hold="7" data-accent="#ffa200" data-scene="4"><img src="/monitor-2/sec-shawarma.png" alt="Shawarma, 28 to 30"></div>
  <div class="card tvslide sec-hotdogs" data-hold="9" data-accent="#ff3a1c" data-scene="5"><img src="/monitor-2/sec-hotdogs.png" alt="Hot dogs, 31 to 35"></div>
  <div class="card tvslide sec-drinks" data-hold="7" data-accent="#ff9a1c" data-scene="8"><img src="/monitor-2/sec-drinks.png" alt="Drinks"></div>
  <div class="bigwipe"></div>
  <div class="card side">
    <img class="side-logo" src="/monitor-2/logo.png" alt="Ajdar Zapata Sandwich">
      <div class="reel" aria-hidden="true">
        <div class="floor"></div>
        <div class="scene">
          <div class="art photos n3"><img class="pic" src="/monitor-2/photo-salami-sub.webp" alt="Salami and sausage sub" style="--k:0"><img class="pic" src="/monitor-2/photo-salami-steak-sub.webp" alt="Salami and steak sub" style="--k:1"><img class="pic" src="/monitor-2/photo-minced-sub.webp" alt="Minced meat sub" style="--k:2"></div>
          <div class="words"><div class="word label" data-text="SANDWICHES"></div><div class="rule"></div>
            <div class="meta"><span class="sub"><small>NO.</small> 11 – 15</span><span class="fa">ساندویچ</span></div></div>
        </div>
        <div class="scene">
          <div class="art photos n2"><img class="pic" src="/monitor-2/photo-beef-patty-sub.webp" alt="Beef patty sub" style="--k:0"><img class="pic" src="/monitor-2/photo-chicken-fillet-sub.webp" alt="Chicken fillet sub with cheese" style="--k:1"></div>
          <div class="words"><div class="word label" data-text="BURGERS"></div><div class="rule"></div>
            <div class="meta"><span class="sub"><small>NO.</small> 16 – 20</span><span class="fa">برگر</span></div></div>
        </div>
        <div class="scene">
          <div class="art design"><svg class="emblem" viewBox="-30 -64 60 68"><path class="mflame" data-layer="0" fill="#e02010" d=""/><path class="mflame" data-layer="1" fill="#ff8a00" d=""/><path class="mflame" data-layer="2" fill="#ffd34d" d=""/></svg></div>
          <div class="words"><div class="word label" data-text="DONER BAGUETTES" data-accent="DONER"></div><div class="rule"></div>
            <div class="meta"><span class="sub"><small>NO.</small> 21 – 24</span><span class="fa">دونر باگت</span></div></div>
        </div>
        <div class="scene">
          <div class="art design"><svg class="emblem" viewBox="-30 -64 60 68"><path class="mflame" data-layer="0" fill="#e02010" d=""/><path class="mflame" data-layer="1" fill="#ff8a00" d=""/><path class="mflame" data-layer="2" fill="#ffd34d" d=""/></svg></div>
          <div class="words"><div class="word label" data-text="DONER PLATTERS" data-accent="PLATTERS"></div><div class="rule"></div>
            <div class="meta"><span class="sub"><small>NO.</small> 25 – 27</span><span class="fa">خوراک دونر</span></div></div>
        </div>
        <div class="scene">
          <div class="art design"><svg class="emblem" viewBox="-30 -64 60 68"><path class="mflame" data-layer="0" fill="#e02010" d=""/><path class="mflame" data-layer="1" fill="#ff8a00" d=""/><path class="mflame" data-layer="2" fill="#ffd34d" d=""/></svg></div>
          <div class="words"><div class="word label" data-text="SHAWARMA"></div><div class="rule"></div>
            <div class="meta"><span class="sub"><small>NO.</small> 28 – 30</span><span class="fa">شاورما</span></div></div>
        </div>
        <div class="scene">
          <div class="art design"><svg class="emblem" viewBox="-30 -64 60 68"><path class="mflame" data-layer="0" fill="#e02010" d=""/><path class="mflame" data-layer="1" fill="#ff8a00" d=""/><path class="mflame" data-layer="2" fill="#ffd34d" d=""/></svg></div>
          <div class="words"><div class="word label" data-text="HOT DOGS" data-accent="DOGS"></div><div class="rule"></div>
            <div class="meta"><span class="sub"><small>NO.</small> 31 – 35</span><span class="fa">هات‌داگ</span></div></div>
        </div>
        <div class="scene">
          <div class="art design"><svg class="emblem" viewBox="-30 -64 60 68"><path class="mflame" data-layer="0" fill="#e02010" d=""/><path class="mflame" data-layer="1" fill="#ff8a00" d=""/><path class="mflame" data-layer="2" fill="#ffd34d" d=""/></svg></div>
          <div class="words"><div class="word label" data-text="STARTERS &amp; SIDES" data-accent="SIDES"></div><div class="rule"></div>
            <div class="meta"><span class="sub"><small>NO.</small> 1 – 10</span><span class="fa">پیش‌غذا</span></div></div>
        </div>
        <div class="scene">
          <div class="art design"><svg class="emblem" viewBox="-30 -64 60 68"><path class="mflame" data-layer="0" fill="#e02010" d=""/><path class="mflame" data-layer="1" fill="#ff8a00" d=""/><path class="mflame" data-layer="2" fill="#ffd34d" d=""/></svg></div>
          <div class="words"><div class="word label" data-text="SAUCE SELECTION" data-accent="SAUCE"></div><div class="rule"></div>
            <div class="meta"><span class="fa">انتخاب سس</span></div></div>
        </div>
        <div class="scene">
          <div class="art design"><svg class="emblem" viewBox="-30 -64 60 68"><path class="mflame" data-layer="0" fill="#e02010" d=""/><path class="mflame" data-layer="1" fill="#ff8a00" d=""/><path class="mflame" data-layer="2" fill="#ffd34d" d=""/></svg></div>
          <div class="words"><div class="word label" data-text="DRINKS"></div><div class="rule"></div>
            <div class="meta"><span class="fa">نوشیدنی‌ها</span></div></div>
        </div>
        <div class="wipe"></div>
      </div>
  </div>
</div>
<div class="sweep"></div>

<script src="/flame.js"></script>
<script src="/monitor-2/motion.js"></script>
<script src="/screen.js"></script>
</body>
</html>
