       shows the words only. To add one: put the cut-out PNG in site/monitor-2/, set it as .soon-photo's src
       and remove the hidden attribute. -->

    <img class="soon-photo" src="" alt="" hidden>
    <div class="soon-words"><span class="soon-en">COMING SOON</span><span class="soon-fa">به‌زودی</span></div>
