<link rel="preconnect" href="https://fonts.googleapis.com">

<body data-monitor="1">
<!-- The left TV (yellow glass): the whole menu at once, in three columns (Ryan, 2 Nov 2026: one TV static
     with everything, the other cycling big). Every section is lifted straight off the boards by
     tools/build-walls.py (nothing retyped). Christmas: the section the right TV is
     showing sparkles round its rim (/show.js keeps both TVs in step; /xmas.js). The text never moves. (No snow here: the
     panels cover nearly all the wall, and drawing it behind them cost a third of the frame rate.) -->
<div id="stage">
  <div class="card sec-starters"><img src="/monitor-1/sec-starters.png" alt="Starters and sides, 1 to 10"></div>
  <div class="card sec-sauces"><img src="/monitor-1/sec-sauces.png" alt="Sauce selection"></div>
  <div class="card sec-drinks"><img src="/monitor-1/sec-drinks.png" alt="Drinks"></div>
  <div class="card sec-sandwiches"><img src="/monitor-1/sec-sandwiches.png" alt="Sandwiches, 11 to 15"></div>
  <div class="card sec-burgers"><img src="/monitor-1/sec-burgers.png" alt="Burgers, 16 to 20"></div>
  <div class="card sec-doner"><img src="/monitor-1/sec-doner.png" alt="Doner baguettes, 21 to 24"></div>
  <div class="card sec-platters"><img src="/monitor-1/sec-platters.png" alt="Doner platters, 25 to 27"></div>
  <div class="card sec-shawarma"><img src="/monitor-1/sec-shawarma.png" alt="Shawarma, 28 to 30"></div>
  <div class="card sec-hotdogs"><img src="/monitor-1/sec-hotdogs.png" alt="Hot dogs, 31 to 35"></div>
</div>
<div class="sweep"></div>
<script src="/flame.js"></script>
<script src="/show.js"></script>
<script src="/xmas.js"></script>
<script src="/screen.js"></script>
</body>
</html>
