     sandwiches, burgers, starters and sauces; the right one has doner, platters, drinks, shawarma and
     hot dogs. Every section is lifted straight off the boards by tools/build-walls.py (nothing retyped). -->
<div id="stage">
  <div class="card sec-sandwiches"><img src="/monitor-1/sec-sandwiches.png" alt="Sandwiches, 11 to 15"></div>
  <div class="card sec-burgers"><img src="/monitor-1/sec-burgers.png" alt="Burgers, 16 to 20"></div>
  <div class="card sec-starters"><img src="/monitor-1/sec-starters.png" alt="Starters and sides, 1 to 10"></div>
  <div class="card sec-sauces"><img src="/monitor-1/sec-sauces.png" alt="Sauce selection"></div>
  <div class="address left" aria-label="864 High Road, London N12 9RH"><div class="frame">864 High Road,</div></div>
